name: Publish Preview Release

on:
  push:
    tags:
      - '20*-r*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'okoklabs/openlabstock'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.16.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Match tag to package version
        shell: bash
        run: |
          expected_tag="$(node -e "const p=require('./package.json');const [date,revision]=p.version.split('-');process.stdout.write(date.replaceAll('.','')+'-'+revision)")"
          test "$GITHUB_REF_NAME" = "$expected_tag" || {
            echo "Tag $GITHUB_REF_NAME does not match package version $expected_tag" >&2
            exit 1
          }

      - name: Verify and build release assets
        run: pnpm run release:prepare

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser smoke tests
        run: pnpm run test:e2e

      - name: Publish GitHub pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="OpenLabStock-production-${GITHUB_REF_NAME}.tar.gz"
          manifest="OpenLabStock-production-${GITHUB_REF_NAME}.manifest.txt"
          cat > "$RUNNER_TEMP/release-notes.md" <<'EOF'
          ## Public Preview

          此版本用于公开试用和部署流程评估，尚未标记为 Stable。首次评估请使用合成数据；规划生产使用前请阅读仓库中的部署、备份、恢复和安全文档。

          下载生产包时请同时下载 manifest，并在解压前核对其中的 SHA-256。

          This is a public preview, not a stable release. Evaluate with synthetic data first and review the deployment, backup, restore, and security documentation before production use.
          EOF
          gh release create "$GITHUB_REF_NAME" "$archive" "$manifest" \
            --verify-tag \
            --prerelease \
            --title "OpenLabStock Public Preview ${GITHUB_REF_NAME}" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
