name: Docker Smoke

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/docker-smoke.yml"
      - ".dockerignore"
      - ".env.docker.example"
      - "Dockerfile"
      - "compose.yaml"
      - "deploy/docker/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "password.mjs"
      - "server.mjs"
      - "storage.mjs"
      - "scripts/backup.mjs"
      - "scripts/reset-owner-password.mjs"
  pull_request:
    paths:
      - ".github/workflows/docker-smoke.yml"
      - ".dockerignore"
      - ".env.docker.example"
      - "Dockerfile"
      - "compose.yaml"
      - "deploy/docker/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "password.mjs"
      - "server.mjs"
      - "storage.mjs"
      - "scripts/backup.mjs"
      - "scripts/reset-owner-password.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Show Docker environment
        run: |
          docker version
          docker compose version

      - name: Run isolated Docker smoke test
        run: bash deploy/docker/openlabstock.sh smoke
