name: Bug report
description: 报告可复现的 OpenLabStock 产品问题
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢报告。请使用合成数据并删除地址、账号、成员姓名、Cookie、Token、数据库和日志中的个人信息。安全漏洞不要填写本表，请使用仓库 Security 页的私密漏洞报告。

  - type: input
    id: version
    attributes:
      label: OpenLabStock 版本
      description: 可从侧栏或 `/api/health` 查看。
      placeholder: 2026.8.14-r41
    validations:
      required: true

  - type: dropdown
    id: deployment
    attributes:
      label: 部署方式
      options:
        - 本地开发
        - Node + systemd
        - Docker Compose
        - 其他
    validations:
      required: true

  - type: input
    id: client
    attributes:
      label: 客户端环境
      placeholder: Windows 11 / Chrome 版本，或 Android / Safari 版本
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 使用最小、可重复步骤和合成数据。
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际行为
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: 脱敏证据
      description: 可附脱敏截图或最小日志。禁止上传数据库、备份、凭据或真实成员资料。

  - type: checkboxes
    id: confirmations
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue，并确认这不是公开披露的安全漏洞。
          required: true
        - label: 我已删除凭据、服务器地址、客户资料和个人数据。
          required: true
